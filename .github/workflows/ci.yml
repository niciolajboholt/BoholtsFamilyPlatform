name: Web CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05_App/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: 05_App/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check Cloudflare binding types
        run: npm run worker:types:check

      - name: Test
        run: npm test

      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke tests
        run: npm run test:e2e

  deploy-beta:
    name: Migrate and deploy beta
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05_App/web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: 05_App/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Record D1 restore point
        run: npx wrangler d1 time-travel info DB --env beta --json

      - name: Apply beta D1 migrations
        run: npx wrangler d1 migrations apply DB --env beta --remote

      - name: Build production assets
        run: npm run build

      - name: Deploy beta Worker
        run: npx wrangler deploy --env beta

      - name: Verify live beta health
        env:
          HEALTH_URL: https://boholtsfamilyplatform-beta.nicolajbach12.workers.dev/api/health
        run: |
          for attempt in {1..12}; do
            response="$(curl --fail --silent --show-error "$HEALTH_URL" || true)"
            if HEALTH_JSON="$response" node -e '
              const health = JSON.parse(process.env.HEALTH_JSON || "{}");
              if (health.status !== "ok" || health.db !== true || health.migrations?.ok !== true) {
                process.exit(1);
              }
              console.log(`Beta healthy; version ${health.version?.id ?? "unknown"}`);
            '; then
              exit 0
            fi
            sleep 5
          done
          echo "Beta health check failed after 12 attempts."
          exit 1
